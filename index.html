<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gero von Manstein</title>
    <meta name="description" content="Private CV – sign in with GitHub to view.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <!-- ══════════════════════════════════════════════════════
         AUTH GATE  – always visible in source, contains NO CV data
    ══════════════════════════════════════════════════════ -->
    <div id="auth-gate" class="gate">
        <div class="gate-card">
            <div class="gate-photo-wrap">
                <img src="gero-professional.jpg" alt="Profile photo" class="gate-photo">
            </div>
            <h1 class="gate-name">Gero von Manstein</h1>
            <p class="gate-tagline">Private CV &nbsp;&middot;&nbsp; Sign in to view</p>
            <p class="gate-note">This page is access-controlled. Authenticate with GitHub to continue.</p>
            <button id="github-signin" class="btn-github">
                <!-- GitHub mark SVG (public logo, no sensitive data) -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57
                    0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695
                    -.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99
                    .105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225
                    -.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405
                    c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225
                    0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3
                    0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                Sign in with GitHub
            </button>
            <p class="gate-privacy">Only your GitHub username is used for authentication. No personal data is stored.</p>
            <p class="gate-privacy" style="margin-top:.5rem">
                <a href="impressum.html" style="color:inherit;text-decoration:underline">Impressum &amp; Datenschutz</a>
            </p>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════════
         CV MOUNT POINT  – empty in source; filled by js/app.js after auth
    ══════════════════════════════════════════════════════ -->
    <div id="cv-root"></div>

    <!-- Firebase ES module -->
    <script type="module" src="js/app.js"></script>

</body>
</html>
